[package]
name = "helium-gecko"
version = "0.1.0"
edition = "2021"
description = "Always-on-top floating browser powered by Gecko/Servo"

[dependencies]
# Windowing and GL
winit = "0.29"
glutin = "0.31"
glutin-winit = "0.4"
raw-window-handle = "0.5"
glow = "0.13"

# UI overlay
egui = "0.24"
egui-winit = "0.24"
egui-wgpu = "0.24"          # not used directly; we use glow
egui_glow = "0.24"

# Browser engine
servo = { git = "https://github.com/servo/servo", branch = "main", features = ["embedding"] }
# servo-embedding-example internal crates – we'll use its public API
# In practice, the servo crate exposes embedder traits; we wrap them.

# Async runtime, channels
tokio = { version = "1", features = ["full"] }
crossbeam = "0.8"

# Serialisation, config, logging
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
log = "0.4"
env_logger = "0.10"
clap = { version = "4", features = ["derive"] }

# Platform-specific (optional)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "startup_bench"
harness = false
